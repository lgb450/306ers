<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>306ers Hockey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a game-sheet. Big condensed numerals, ruled rows, one goal-light red accent, one blue for magnitude. */
:root{
  /* Logo palette: wheat green #087838 and gold #F8C008 */
  --bg:#f3f7f3; --surface:#ffffff; --ink:#0f2418; --muted:#586a5f; --line:#d8e3da;
  --brand:#087838; --accent:#f8c008; --heat:#087838; --good:#0b8a42; --mid:#f8c008; --bad:#d6453b; --them:#8a9a90;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08130d; --surface:#0f1f16; --ink:#e8f1ea; --muted:#9bb0a2; --line:#21392b;
  --brand:#0a5a2b; --accent:#f8c008; --heat:#3fbf74; --good:#3fbf74; --mid:#e6b422; --bad:#ff7a70; --them:#7f9487; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#08130d; --surface:#0f1f16; --ink:#e8f1ea; --muted:#9bb0a2; --line:#21392b;
  --brand:#0a5a2b; --accent:#f8c008; --heat:#3fbf74; --good:#3fbf74; --mid:#e6b422; --bad:#ff7a70; --them:#7f9487; color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);font-variant-numeric:tabular-nums}
a{color:var(--heat)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-size:1.9rem;line-height:1.1}
h3{font-size:1.2rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{background:var(--brand);color:#fff;border-bottom:5px solid var(--accent)}
.top .wrap{display:flex;gap:16px 28px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;padding-top:20px;padding-bottom:16px}
.brand{font-family:var(--display);font-weight:700;font-size:3.4rem;line-height:.9;letter-spacing:.01em}
.brand small{display:block;font-size:1rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-top:6px}
.rec{display:flex;gap:22px;flex-wrap:wrap}
.rec div{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;opacity:.95}
.rec b{display:block;font-size:2.1rem;letter-spacing:0;line-height:1;font-weight:700}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:0;padding-bottom:0}
nav.tabs a{font-family:var(--display);font-weight:600;font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:12px 14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,summary:focus-visible,th button:focus-visible{outline:3px solid var(--heat);outline-offset:-3px}
main{padding:24px 0 56px}
section.view{display:none}
section.view.on{display:block}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.card h3{margin-bottom:10px}
.lede{color:var(--muted);max-width:68ch;margin:6px 0 20px}
.note{color:var(--muted);font-size:.88rem;max-width:78ch;margin:12px 0 0}
.stack{display:flex;flex-direction:column;gap:16px}
.tile b{display:block;font-family:var(--display);font-size:2.6rem;line-height:1;font-weight:700}
.tile span{color:var(--muted);font-size:.9rem}
.pill{display:inline-block;min-width:1.7em;text-align:center;font-family:var(--display);font-weight:700;font-size:.95rem;letter-spacing:.04em;padding:1px 7px;border-radius:3px;color:#fff}
.pill.W{background:var(--good)} .pill.L{background:var(--bad)} .pill.up{background:transparent;color:var(--muted);border:1px solid var(--line)}
.strip{display:flex;gap:8px;flex-wrap:wrap}
.strip .g{border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:104px;background:var(--bg)}
.strip .g small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.strip .g b{font-family:var(--display);font-size:1.3rem}
.next{display:grid;gap:4px}
.next .big{font-family:var(--display);font-size:2.2rem;font-weight:700;line-height:1}
.next .when{color:var(--muted)}
ol.rank,ul.plain{list-style:none;margin:0;padding:0}
ol.rank li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
ol.rank li:first-child{border-top:0}
ol.rank .n{font-family:var(--display);font-weight:700;font-size:1.25rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
thead th{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted);font-size:.95rem;background:var(--surface);position:sticky;top:0}
th button{all:unset;cursor:pointer;display:block;width:100%;text-align:inherit}
th[aria-sort] button::after{content:" ▼";font-size:.7em;color:var(--heat)}
th[aria-sort="ascending"] button::after{content:" ▲"}
tbody tr:last-child td{border-bottom:0}
tr.sep td{background:var(--bg);font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:.85rem}
td.pl{font-weight:600}
td.num{font-family:var(--display);font-size:1.1rem}
.tag{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-left:6px}
.boxes{display:inline-flex;gap:2px;vertical-align:middle}
.boxes i{display:block;width:10px;height:18px;border-radius:2px;background:var(--surface);border:1px solid var(--line)}
.boxes i.b1{background:var(--mid);border-color:var(--mid)}
.boxes i.b2{background:var(--good);border-color:var(--good)}
.sw.b0{background:var(--surface);border:1px solid var(--line)} .sw.b1{background:var(--mid)} .sw.b2{background:var(--good)}
td.sc{font-family:var(--display);font-size:1.1rem}
h3 a.jump{color:inherit;text-decoration:none;border-bottom:2px solid var(--accent)}
h3 a.jump:hover{color:var(--heat)}
h3 a.jump::after{content:" \2192"}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.85rem;margin:8px 0}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.ctl button{font:600 .95rem var(--body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.matrix td,.matrix th{padding:0;border:0;text-align:center}
.matrix .cell{width:30px;height:28px;font-family:var(--display);font-size:1rem;display:flex;align-items:center;justify-content:center;margin:1px;border-radius:2px;background:color-mix(in srgb,var(--heat) calc(var(--t)*100%),var(--bg));color:var(--ink)}
.matrix .cell.on{color:#fff}
.matrix .cell.z{background:transparent}
.matrix .rowh{position:sticky;left:0;background:var(--surface);text-align:right;padding:0 8px;font-size:.85rem;white-space:nowrap;z-index:1;min-width:150px}
.matrix .colh{height:132px;vertical-align:bottom;font-size:.85rem}
.matrix .colh span{display:block;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;margin:0 auto 4px;font-weight:500}
.matrix .tot{font-family:var(--display);color:var(--muted);font-size:.95rem;padding:0 8px}
.matrix .cell.self{background:#000;outline:1px solid var(--line)}
.matrix th.hl{background:var(--accent);color:#0f2418}
.matrix .rowh.hl{background:var(--accent)}
.matrix .axis{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:.9rem;padding:4px 8px}
.matrix .axis.c{text-align:center;border-bottom:1px solid var(--line)}
.matrix .corner{vertical-align:bottom;text-align:right;padding:0 8px 6px;font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:.9rem;position:sticky;left:0;background:var(--surface);z-index:1}
.how{background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:6px;padding:10px 14px;margin:0 0 14px;max-width:80ch}
.scale{display:inline-flex;align-items:center;gap:4px}
.scale i{display:inline-block;width:18px;height:12px;border-radius:2px;background:color-mix(in srgb,var(--heat) calc(var(--t)*100%),var(--bg))}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;font-size:.92rem}
.bar .track{display:flex;height:12px;background:var(--bg);border-radius:2px;overflow:hidden;gap:2px}
.bar .track i{display:block;height:100%}
.bar .v{font-family:var(--display);text-align:right;font-size:1.05rem}
.gcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:6px;padding:14px 16px}
.gcard.W{border-left-color:var(--good)}
.gcard .hd{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.gcard .sc{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1}
.gcard .meta{color:var(--muted);font-size:.9rem}
.gcard h3.head{text-transform:none;letter-spacing:0;color:var(--ink);font-size:1.45rem;margin:6px 0 4px}
.gcard p{margin:0 0 8px;max-width:70ch}
details summary{cursor:pointer;font-weight:600;color:var(--heat);padding:4px 0}
.log{margin:8px 0 0;font-size:.9rem}
.log li{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:3px 0;border-top:1px solid var(--line)}
.log .us{font-weight:600}
.log .them{color:var(--muted)}
.log small{color:var(--muted)}
.per{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}
.pcol{display:grid;gap:6px}
.pcol .pair{display:flex;align-items:flex-end;gap:6px;height:130px}
.pcol .pair i{display:block;flex:1;border-radius:2px 2px 0 0;position:relative;min-height:2px}
.pcol .pair i b{position:absolute;top:-1.35em;left:0;right:0;text-align:center;font-family:var(--display);font-size:1rem;font-weight:600}
.pcol .lab{text-align:center;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.us-c{background:var(--heat)} .them-c{background:var(--them)}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.85rem;padding:6px 9px;border-radius:4px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
.hot{color:var(--good);font-weight:700}
.sub{color:var(--muted);font-weight:400}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;padding:18px 0 40px}
@media (max-width:560px){
  .brand{font-size:2.6rem}
  .bar{grid-template-columns:110px 1fr 36px}
  .matrix .rowh{min-width:118px;font-size:.8rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">306ers<small id="sub"></small></div>
  <div class="rec" id="rec"></div>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs"></div></nav>
<main class="wrap">
  <section class="view" id="v-overview"></section>
  <section class="view" id="v-player-stats"></section>
  <section class="view" id="v-connections"></section>
  <section class="view" id="v-trends"></section>
  <section class="view" id="v-game-recaps"></section>
  <section class="view" id="v-schedule"></section>
</main>
<footer><div class="wrap">
  Numbers come from the public CMHA pages (team stats, schedule and game summaries) through game <span id="asof-n"></span>, <span id="asof-d"></span>. Skater totals computed from the game summaries match the CMHA stats page. <span id="nosum"></span> CMHA does not publish who dressed for each game, so a 0 for a player in a game can mean a quiet night or a night off.
</div></footer>
<div class="tip" id="tip" role="tooltip"></div>
<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
var D = JSON.parse(document.getElementById('data').textContent);
var $ = function(s,r){return (r||document).querySelector(s)};
var esc = function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function dt(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function dlabel(s){var d=dt(s);return DOW[d.getDay()]+', '+MONTHS[d.getMonth()]+' '+d.getDate()}
function dshort(s){var d=dt(s);return MONTHS[d.getMonth()]+' '+d.getDate()}
function arena(c){return D.arenas[c]||c}
function last(n){return n.split(' ').slice(-1)[0]}
function oppName(o){return o}
var goalieNames = D.goalies.map(function(g){return g.name});

/* ---------- derived numbers ---------- */
var played = D.sched.filter(function(s){return s.res});
var upcoming = D.sched.filter(function(s){return !s.res});
var nSum = D.games.length;
var sumNs = D.games.map(function(g){return g.n});
var noSum = played.filter(function(s){return sumNs.indexOf(s.n)<0});
(function(){var l=played[played.length-1];
  $('#asof-n').textContent=l?l.n:0; $('#asof-d').textContent=l?dshort(l.date):'';
  $('#nosum').textContent=noSum.length?(noSum.length===1?'Game '+noSum[0].n+' (a '+noSum[0].gf+'-'+noSum[0].ga+' '+(noSum[0].res==='W'?'win':'loss')+(noSum[0].ha==='H'?' vs ':' at ')+noSum[0].opp+') has no game summary, so it appears in the record and schedule but not in the goal-by-goal analysis.'
    :noSum.length+' games have no game summary, so they appear in the record and schedule but not in the goal-by-goal analysis.'):'';
 })();
function plural(n,w){return n+' '+(n===1?w:w+(/s$/.test(w)?'es':'s'))}
var W = played.filter(function(s){return s.res==='W'}).length, L = played.length-W;
var GF = played.reduce(function(a,s){return a+s.gf},0), GA = played.reduce(function(a,s){return a+s.ga},0);
var P = D.players.filter(function(p){return goalieNames.indexOf(p.name)<0 || p.pts>0});
var gameLabel = {}; D.doneNs.forEach(function(n,i){gameLabel[i]=n});

/* ---------- tooltip ---------- */
var tip = $('#tip');
document.addEventListener('mouseover',function(e){var t=e.target.closest('[data-tip]'); if(!t){tip.style.display='none';return}
  tip.textContent=t.getAttribute('data-tip'); tip.style.display='block'; place(e)});
document.addEventListener('mousemove',function(e){if(tip.style.display==='block')place(e)});
document.addEventListener('mouseout',function(e){if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('[data-tip]'))tip.style.display='none'});
function place(e){var w=tip.offsetWidth,h=tip.offsetHeight,x=e.clientX+14,y=e.clientY+14;
  if(x+w>innerWidth-8)x=innerWidth-w-8; if(y+h>innerHeight-8)y=e.clientY-h-12; tip.style.left=Math.max(8,x)+'px'; tip.style.top=Math.max(8,y)+'px'}

/* ---------- header ---------- */
$('#sub').textContent = 'Division 4 · 2026/27 · Calgary Men’s Hockey Association';
$('#rec').innerHTML =
  '<div><b>'+W+'-'+L+'</b>Record</div>'+
  '<div><b>'+GF+'-'+GA+'</b>Goals for-against</div>'+
  '<div><b>'+played.length+'/'+D.sched.length+'</b>Games played</div>';

/* ---------- tabs / routing ---------- */
var TABS=[['overview','Overview'],['player-stats','Player Stats'],['connections','Connections'],['trends','Trends'],['game-recaps','Game Recaps'],['schedule','Schedule']];
$('#tabs').innerHTML = TABS.map(function(t){return '<a href="#'+t[0]+'" data-t="'+t[0]+'">'+t[1]+'</a>'}).join('');
function route(){var h=(location.hash||'#overview').slice(1); if(h==='players')h='player-stats'; if(h==='games')h='game-recaps'; if(!TABS.some(function(t){return t[0]===h}))h='overview';
  TABS.forEach(function(t){var on=t[0]===h; $('#v-'+t[0]).classList.toggle('on',on);
    var a=$('#tabs a[data-t="'+t[0]+'"]'); if(on)a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current')});}
addEventListener('hashchange',function(){route();scrollTo(0,0)}); route();

/* ---------- OVERVIEW ---------- */
(function(){
  var nx = upcoming[0] || null;
  var h2h = nx ? played.filter(function(s){return s.opp===nx.opp}) : [];
  var h2hTxt = h2h.length ? h2h.map(function(s){return '<span class="pill '+s.res+'">'+s.res+'</span> '+s.gf+'-'+s.ga+' on '+dshort(s.date)}).join(' &nbsp; ') : 'First meeting this season';
  var recent = played.slice(-6).reverse().map(function(s){
    return '<div class="g"><small>'+dshort(s.date)+' '+(s.ha==='H'?'vs':'@')+' '+esc(s.opp)+'</small><b><span class="pill '+s.res+'">'+s.res+'</span> '+s.gf+'-'+s.ga+'</b></div>'}).join('');
  function top(key,n){return P.slice().sort(function(a,b){return b[key]-a[key]||b.pts-a.pts}).slice(0,n)}
  function list(arr,key){return '<ol class="rank">'+arr.map(function(p){return '<li><span>'+esc(p.name)+'</span><span class="n">'+p[key]+'</span></li>'}).join('')+'</ol>'}
  var hot = P.filter(function(p){return p.gp>0}).slice().sort(function(a,b){return b.last5-a.last5||b.pts-a.pts}).slice(0,5);
  var awards = buildAwards();
  $('#v-overview').innerHTML =
   '<h2>Where we stand</h2><p class="lede">'+winLossLine()+'</p>'+
   '<div class="grid g2">'+
    (nx?'<div class="card next"><h3>Next game</h3><div class="big">'+(nx.ha==='H'?'vs':'@')+' '+esc(nx.opp)+'</div>'+
      '<div class="when">'+dlabel(nx.date)+' · '+nx.time+' · '+esc(arena(nx.arena))+' ('+(nx.ha==='H'?'home':'away')+')</div>'+
      '<div style="margin-top:8px"><span class="sub">Earlier this season:</span> '+h2hTxt+'</div>'+
      (nx.gid?'<div style="margin-top:8px"><a href="https://cmhahockey.com/game/'+nx.gid+'/preview" rel="noopener">CMHA game preview</a></div>':'')+'</div>'
     :'<div class="card next"><h3>Next game</h3><div class="big">Season complete</div><div class="when">No games left on the schedule.</div></div>')+
    '<div class="card"><h3>Last six</h3><div class="strip">'+recent+'</div></div>'+
   '</div>'+
   '<div class="grid g3" style="margin-top:16px">'+
    '<div class="card"><h3><a class="jump" href="#player-stats" data-sort="pts">Points</a></h3>'+list(top('pts',5),'pts')+'</div>'+
    '<div class="card"><h3><a class="jump" href="#player-stats" data-sort="g">Goals</a></h3>'+list(top('g',5),'g')+'</div>'+
    '<div class="card"><h3><a class="jump" href="#player-stats" data-sort="a">Assists</a></h3>'+list(top('a',5),'a')+'</div>'+
   '</div>'+
   '<div class="grid g2" style="margin-top:16px">'+
    '<div class="card"><h3>Hot right now</h3><p class="sub" style="margin:0 0 8px">Points over the last five games with a game summary.</p><ol class="rank">'+
      hot.map(function(p){return '<li><span>'+esc(p.name)+' <span class="sub">'+p.by.slice(-5).join(' · ')+'</span></span><span class="n">'+p.last5+'</span></li>'}).join('')+'</ol></div>'+
    '<div class="card"><h3>Season awards</h3><ul class="plain">'+awards.map(function(a){return '<li style="padding:6px 0;border-top:1px solid var(--line)"><b>'+a[0]+'</b> '+a[1]+'</li>'}).join('')+'</ul></div>'+
   '</div>';
  $('#v-overview').addEventListener('click',function(e){var a=e.target.closest('a[data-sort]'); if(a&&D.setSort)D.setSort(a.getAttribute('data-sort'))});
  function winLossLine(){
    var close = played.filter(function(s){return Math.abs(s.gf-s.ga)<=1}).length;
    var bigW = played.filter(function(s){return s.res==='W'&&s.gf-s.ga>=3}).length;
    var w=played.filter(function(s){return s.res==='W'}).length, l=played.length-w;
    if(!played.length) return 'No games played yet.';

    '<div class="card"><h3>Record splits</h3><div class="tablewrap" style="border:0"><table><thead><tr><th>Split</th><th>W-L</th><th>GF-GA</th><th>Diff</th></tr></thead><tbody>'+
      row('Home',rec(function(s){return s.ha==='H'}))+row('Away',rec(function(s){return s.ha==='A'}))+
      row('Weekday (Mon to Fri)',rec(function(s){var d=dt(s.date).getDay();return d>=1&&d<=5}))+row('Weekend (Sat and Sun)',rec(function(s){var d=dt(s.date).getDay();return d===0||d===6}))+
      row('Before 6 PM start',rec(function(s){return startH(s)<18}))+row('6 to 8 PM start',rec(function(s){return startH(s)>=18&&startH(s)<20}))+row('8 PM or later start',rec(function(s){return startH(s)>=20}))+
      '</tbody></table></div></div>'+
    '<div class="card"><h3>By opponent</h3><div class="tablewrap" style="border:0"><table><thead><tr><th>Opponent</th><th>W-L</th><th>GF-GA</th><th>Diff</th></tr></thead><tbody>'+
      opps.map(function(o){return row(o,rec(function(s){return s.opp===o}))}).join('')+'</tbody></table></div></div>'+
   '</div>'+
   '<div class="card" style="margin-top:16px"><h3>By rink</h3><div class="tablewrap" style="border:0"><table><thead><tr><th>Rink</th><th>W-L</th><th>GF-GA</th><th>Diff</th></tr></thead><tbody>'+
      arenas.map(function(a){return row(arena(a),rec(function(s){return s.arena===a}))}).join('')+'</tbody></table></div><p class="note">Small samples: most rinks have one to three games so far.</p></div>';
})();
})();
</script>
</body>
</html>
